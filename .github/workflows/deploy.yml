name: CD

on:
  push:
    branches: [main, master]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    env:
      # secrets 不能直接用在步骤的 if 里,映射到 job env 供下方中继部署步骤判断是否配置
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # 部署到 Cloudflare Workers。
      # 需要在仓库 Settings → Secrets and variables → Actions 配置:
      #   CF_API_TOKEN   — Cloudflare API Token(需 Workers 编辑权限,secret)
      #   CF_ACCOUNT_ID  — Cloudflare Account ID(secret)
      # 可选:Settings → Variables 配置 CUSTOM_DOMAIN(如 jiexi.example.com),部署时绑定自定义域名;
      # 不配置则只使用 workers.dev 域名。
      # BOT_TOKEN / WEBHOOK_SECRET / INSTAGRAM_COOKIE 等 Worker secrets 已存于 Cloudflare,
      # wrangler deploy 不会清除,无需在 CI 中重复配置。
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: deploy ${{ vars.CUSTOM_DOMAIN != '' && format('--domains {0}', vars.CUSTOM_DOMAIN) || '' }}

      # 部署 Vercel 中继(vercel-proxy/;项目 rootDirectory 已指向该目录,从仓库根目录部署)。
      # 需要 secrets:
      #   VERCEL_TOKEN      — https://vercel.com/account/tokens 创建(项目级 scope 即可)
      #   VERCEL_ORG_ID / VERCEL_PROJECT_ID — 见 vercel-proxy/.vercel/project.json
      # 未配置 VERCEL_TOKEN 时跳过(中继很少改,不阻塞 worker 部署);
      # Vercel 项目的 Git 直连已断开,中继只经此流水线受门控部署。
      # 注:不用 vercel pull/build(需团队 API 权限);手写 .vercel/project.json 链接后直接 deploy
      - name: Deploy relay to Vercel
        if: ${{ env.VERCEL_TOKEN != '' }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s"}' "$VERCEL_PROJECT_ID" "$VERCEL_ORG_ID" > .vercel/project.json
          npx vercel deploy --prod --yes --token="$VERCEL_TOKEN"
